name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    name: Current runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_MODE: observe
      LIVE_TRANSFERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run offline financial lifecycle and HTTP tests
        run: npm test
  historical-tests:
    name: Historical regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_MODE: observe
      LIVE_TRANSFERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run synthetic and mocked historical suites
        run: python scripts/test_archives.py
